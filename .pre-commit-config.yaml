repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
    - id: ruff
    - id: ruff-format
      args: [ --preview ]
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.19.2
    hooks:
    - id: commitizen
    - id: commitizen-branch
      stages:
      - pre-push
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.8  # Use the latest stable version
    hooks:
      - id: uv-export
        name: export-pylock
        args: ["--format", "pylock.toml", "--output-file", "pylock.toml", "--no-dev"]
        files: ^(uv\.lock|pyproject\.toml)$

      - id: uv-export
        name: export-pylock-gui
        args: ["--format", "pylock.toml", "--output-file", "pylock.gui.toml", "--no-dev", "--extra", "gui"]
        files: ^(uv\.lock|pyproject\.toml)$