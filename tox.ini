[tox]
envlist = py3{10-14},py314t

[testenv:py3{10-}]
package=wheel
dependency_groups = test-gui
extras=gui
commands = pytest --basetemp={envtmpdir} -v
passenv =
    QT_QPA_PLATFORM

[testenv:py3{14-}t]
package=wheel
extras=speedwagon
dependency_groups = test
commands = pytest --basetemp={envtmpdir} -v

